

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Information Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-8 md:p-10 mt-10 mb-10">
      
      <input type="hidden" id="submitUrlPattern" value="{% url 'submit_application' paper_id=99999 %}" />
      
      <h2 class="font-semibold text-2xl md:text-3xl mb-8 text-gray-800" id="formTitle" style="font-style: italic;">
        Personal Information
      </h2>
      <form id="infoForm" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-2">Are you a Fresher or Experienced? <span class="text-red-500">*</span></label>
          <div class="flex space-x-6">
            
            <label class="inline-flex items-center">
              <input type="radio" name="candidateType" value="fresher" id="typeFresher" class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-500" required>
              <span class="ml-2 text-sm text-gray-700">Fresher (0 Years)</span>
            </label>
            
            <label class="inline-flex items-center">
              <input type="radio" name="candidateType" value="experienced" id="typeExperienced" class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-500" required>
              <span class="ml-2 text-sm text-gray-700">Experienced (1+ Years)</span>
            </label>
            
          </div>
          <p class="text-xs text-red-500 mt-1 hidden" id="error_candidateType"></p>
        </div>
        
        <hr class="mb-6 mt-6 border-gray-200">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name <span class="text-red-500">*</span></label>
            <input type="text" id="fullName" name="full_name" required pattern="^[A-Za-z ]{3,}$"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
              autocomplete="off"
              />
            <p class="text-xs text-red-500 mt-1 hidden" id="error_fullName"></p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email <span class="text-red-500">*</span></label>
            <input type="email" id="email" name="email" required
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
              autocomplete="off"
              />
            <p class="text-xs text-red-500 mt-1 hidden" id="error_email"></p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Mobile <span class="text-red-500">*</span></label>
            <input type="tel" id="mobile" name="phone_number" required pattern="^\d{10,13}$"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"
              maxlength="13"
              autocomplete="off"
              />
            <p class="text-xs text-red-500 mt-1 hidden" id="error_mobile"></p>
          </div>
        </div>
        
        <div id="experiencedFields" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 hidden">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Total Experience (Years) <span class="text-red-500">*</span></label>
            <input type="number" step="0.5" min="0.5" id="experience" name="total_experience"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"/>
            <p class="text-xs text-red-500 mt-1 hidden" id="error_experience"></p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Current CTC ₹</label>
            <input type="number" step="any" id="currentCTC" name="current_ctc"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Current CTC Rate</label>
            <input type="number" step="any" id="currentCTCRate" name="current_ctc_rate"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Notice Period</label>
            <input type="text" id="noticePeriod" name="notice_period"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"/>
          </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Your Skills</label>
            <input type="text" id="skills" name="skills"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Expected CTC ₹</label>
            <input type="number" step="any" id="expectedCTC" name="expected_ctc"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Expected CTC Rate</label>
            <input type="number" step="any" id="expectedCTCRate" name="expected_ctc_rate"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Current Location</label>
            <input type="text" id="location" name="current_location"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">From where did you hear about us?</label>
            <input type="text" id="referral" name="referral_source"
              class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600"/>
          </div>
          <div class="md:block hidden"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">CV or Resume <span class="text-red-500">*</span></label>
            <div class="flex space-x-3">
              <label class="bg-blue-500 text-white text-sm font-semibold py-2 px-4 rounded-xl cursor-pointer hover:bg-blue-600 transition-colors" for="resume">Add Resume</label>
              <label class="bg-gray-200 text-gray-800 text-sm font-semibold py-2 px-4 rounded-xl cursor-pointer hover:bg-gray-300 transition-colors" for="resume">Browse</label>
              <input type="file" id="resume" name="resume_file" accept=".pdf,.doc,.docx" required class="hidden" />
            </div>
            <span id="resumeFilename" class="text-gray-500 text-sm block mt-1">No file selected</span>
            <p class="text-xs text-red-500 mt-1 hidden" id="error_resume"></p>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Photo <span class="text-red-500">*</span></label>
            <div class="flex space-x-3">
              <label class="bg-gray-200 text-gray-800 text-sm font-semibold py-2 px-4 rounded-xl cursor-pointer hover:bg-gray-300 transition-colors" for="photo">Add Photo</label>
              <label class="bg-gray-200 text-gray-800 text-sm font-semibold py-2 px-4 rounded-xl cursor-pointer hover:bg-gray-300 transition-colors" for="photo">Browse</label>
              <input type="file" id="photo" name="photo_file" accept="image/png,image/jpeg" required class="hidden" />
            </div>
            <span id="photoFilename" class="text-gray-500 text-sm block mt-1">No file selected</span>
            <p class="text-xs text-red-500 mt-1 hidden" id="error_photo"></p>
          </div>
          <div class="md:block hidden"></div>
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">Cover Letter <span class="text-xs text-gray-400" id="coverWordCount">0/500 words</span></label>
          <textarea rows="5" id="coverLetter" name="cover_letter" maxlength="4000" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-600 focus:border-blue-600 resize-y"></textarea>
          <p class="text-xs text-red-500 mt-1 hidden" id="error_coverLetter"></p>
        </div>
        
        <div class="flex items-center space-x-4 mt-6">
          <button type="submit" class="bg-blue-600 text-white font-semibold py-2 px-8 rounded-xl hover:bg-blue-700 transition">
            Apply
          </button>
          <button type="button" class="text-gray-600 font-semibold py-2 px-8 rounded-xl hover:text-gray-800 transition" onclick="window.history.back();">
            Cancel
          </button>
        </div>
      </form> <div id="submitSuccess" class="hidden flex flex-col items-center justify-center min-h-[300px]">
        <svg class="w-16 h-16 text-green-500 mb-5" fill="none" stroke="currentColor" stroke-width="1.5"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M4.5 12.75l6 6 9-13.5" />
        </svg>
        <h3 class="text-xl font-bold text-green-600 mb-2">Application Submitted!</h3>
        <p class="text-gray-700 text-base mb-4 text-center">We have received your application.<br />We will connect with you soon.</p>
        <button onclick="window.location.reload()" class="bg-blue-600 text-white font-semibold py-2 px-6 rounded-xl hover:bg-blue-700 transition">Submit Another</button>
      </div>
      
      <p class="mt-14 mb-2 text-center text-xs text-gray-400">&copy; 2025 By AveryBit</p>
    </div>
  </div>
  <script>
    const experiencedFields = document.getElementById('experiencedFields');
    // Radio buttons ka selector
    const candidateTypeInputs = document.querySelectorAll('input[name="candidateType"]');
    const experienceInput = document.getElementById('experience');
    const errorCandidateType = document.getElementById('error_candidateType');
    const errorExperience = document.getElementById('error_experience'); // New error element for experience

    // फ़ील्ड्स को कंडीशनल रूप से दिखाने/छिपाने का फ़ंक्शन
    function toggleFields() {
      // Checked radio button ki value len
      const selectedType = document.querySelector('input[name="candidateType"]:checked')?.value;
      
      if (selectedType === 'experienced') {
        experiencedFields.classList.remove('hidden');
        // Experience required for experienced users
        experienceInput.setAttribute('required', 'required');
      } else {
        experiencedFields.classList.add('hidden');
        // Remove required attributes and clear fields for freshness
        experienceInput.removeAttribute('required');
        errorExperience.classList.add('hidden'); // Hide specific error if type changes
        
        // Optionally clear values of hidden fields to prevent unintended submission of old data
        experienceInput.value = '';
        document.getElementById('currentCTC').value = '';
        document.getElementById('currentCTCRate').value = '';
        document.getElementById('noticePeriod').value = '';
      }
    }

    // Event Listener for the radio buttons
    candidateTypeInputs.forEach(radio => {
        radio.addEventListener('change', toggleFields);
    });
    
    // Initial call (default is hidden)
    toggleFields();


    // File name display
    document.getElementById('resume').addEventListener('change', function(){
      const file = this.files[0];
      const filenameSpan = document.getElementById('resumeFilename');
      filenameSpan.textContent = file ? (file.name.length > 30 ? file.name.slice(0,27) + '...' : file.name) : 'No file selected';
    });
    document.getElementById('photo').addEventListener('change', function(){
      const file = this.files[0];
      const filenameSpan = document.getElementById('photoFilename');
      filenameSpan.textContent = file ? (file.name.length > 30 ? file.name.slice(0,27) + '...' : file.name) : 'No file selected';
    });

    // Cover letter word counter
    document.getElementById('coverLetter').addEventListener('input', function(){
      const words = this.value.trim().split(/\s+/).filter(Boolean);
      document.getElementById('coverWordCount').textContent = `${words.length}/500 words`;
      if(words.length > 500){
        document.getElementById('error_coverLetter').classList.remove('hidden');
        document.getElementById('error_coverLetter').textContent = "Cover letter exceeds 500 words limit.";
      } else {
        document.getElementById('error_coverLetter').classList.add('hidden');
      }
    });

    // --- NEW: Function to get Paper ID directly from URL ---
    function getPaperIdFromUrl() {
        // Assuming URL pattern is /some-path/paper_id/
        const path = window.location.pathname;
        const parts = path.split('/').filter(p => p.length > 0); // Split and remove empty strings
        
        // The paper ID should be the last numeric segment in the URL.
        // If the URL is like /interview/apply/123/ and 'parts' is ['interview', 'apply', '123']
        if (parts.length > 0) {
            const potentialId = parts[parts.length - 1];
            // Check if it's a number and return it
            if (!isNaN(potentialId) && Number.isInteger(parseFloat(potentialId))) {
                return potentialId;
            }
        }
        return null;
    }
    // --------------------------------------------------------

    // Validation on submit
    document.getElementById('infoForm').addEventListener('submit', function(e){
      e.preventDefault(); 

      let valid = true;
      
      // 1. Reset all previous error messages before validation
      document.querySelectorAll('.text-red-500').forEach(p => p.classList.add('hidden'));

      // Get the current selected value for candidateType
      const type = document.querySelector('input[name="candidateType"]:checked')?.value;
      
      // 2. Candidate Type Validation (Frontend Check)
      if (!type) {
        errorCandidateType.textContent = "Please select your status (Fresher or Experienced).";
        errorCandidateType.classList.remove('hidden');
        valid = false;
      }
      
      // 3. Full Name validation (Frontend Check)
      const fullNameVal = document.getElementById('fullName').value.trim();
      if(!/^[A-Za-z ]{3,}$/.test(fullNameVal)){
        document.getElementById('error_fullName').textContent = "Enter at least 3 letters, letters only.";
        document.getElementById('error_fullName').classList.remove('hidden');
        valid = false;
      }
      
      // 4. Email validation (Frontend Check)
      const emailVal = document.getElementById('email').value.trim();
      if(!emailVal){
        document.getElementById('error_email').textContent = "Email is required.";
        document.getElementById('error_email').classList.remove('hidden');
        valid = false;
      }else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)){
        document.getElementById('error_email').textContent = "Invalid email format.";
        document.getElementById('error_email').classList.remove('hidden');
        valid = false;
      }
      
      // 5. Mobile validation (Frontend Check)
      const mobVal = document.getElementById('mobile').value.trim();
      if(!/^\d{10,13}$/.test(mobVal)){
        document.getElementById('error_mobile').textContent = "Enter only digits, 10-13 characters.";
        document.getElementById('error_mobile').classList.remove('hidden');
        valid = false;
      }

      // 6. Experienced fields validation (Frontend Check, only if experienced is selected)
      if (type === 'experienced') {
          const expVal = experienceInput.value.trim();
          const expNum = parseFloat(expVal);

          if (!expVal) {
              errorExperience.textContent = "Total Experience is required for experienced applicants.";
              errorExperience.classList.remove('hidden');
              valid = false;
          } else if (isNaN(expNum) || expNum <= 0) {
              errorExperience.textContent = "Experience must be a valid number greater than 0.";
              errorExperience.classList.remove('hidden');
              valid = false;
          }
      } 
      
      // 7. Resume validation (Frontend Check)
      const resumeInput = document.getElementById('resume');
      const resumeFile = resumeInput.files[0];
      if(!resumeFile){
        document.getElementById('error_resume').textContent = "Resume is required.";
        document.getElementById('error_resume').classList.remove('hidden');
        valid = false;
      }else if(!/\.(pdf|doc|docx)$/i.test(resumeFile.name)){
        document.getElementById('error_resume').textContent = "Allowed formats: pdf, doc, docx.";
        document.getElementById('error_resume').classList.remove('hidden');
        valid = false;
      }else if(resumeFile.size > 2*1024*1024){
        document.getElementById('error_resume').textContent = "Max file size: 2MB.";
        document.getElementById('error_resume').classList.remove('hidden');
        valid = false;
      }
      
      // 8. Photo validation (Frontend Check)
      const photoInput = document.getElementById('photo');
      const photoFile = photoInput.files[0];
      if(!photoFile){
        document.getElementById('error_photo').textContent = "Photo is required.";
        document.getElementById('error_photo').classList.remove('hidden');
        valid = false;
      }else if(!/\.(png|jpg|jpeg)$/i.test(photoFile.name)){
        document.getElementById('error_photo').textContent = "Allowed formats: png, jpg, jpeg.";
        document.getElementById('error_photo').classList.remove('hidden');
        valid = false;
      }else if(photoFile.size > 1*1024*1024){
        document.getElementById('error_photo').textContent = "Max file size: 1MB.";
        document.getElementById('error_photo').classList.remove('hidden');
        valid = false;
      }
      
      // 9. Cover Letter word count (Frontend Check)
      const coverText = document.getElementById('coverLetter').value.trim();
      const wordCount = coverText.split(/\s+/).filter(Boolean).length;
      if(wordCount > 500){
        document.getElementById('error_coverLetter').textContent = "Cover letter exceeds 500 words limit.";
        document.getElementById('error_coverLetter').classList.remove('hidden');
        valid = false;
      }

    // --- FINAL SUBMISSION LOGIC ---
    if (valid) {
        const infoForm = document.getElementById('infoForm');
        const formData = new FormData(infoForm);
        const csrfToken = document.querySelector('input[name="csrfmiddlewaretoken"]').value;
        
        // --- 🔴 IMPORTANT: GET PAPER ID DIRECTLY FROM URL ---
        const paperId = getPaperIdFromUrl(); 
        
        if (!paperId) {
            alert("Error: Question Paper ID could not be found in the URL. Cannot submit application.");
            return; // Stop submission
        }
        
        // Get the URL pattern with the placeholder
        const urlPattern = document.getElementById('submitUrlPattern').value;
        
        // Replace the placeholder (99999) with the actual paperId
        const submitUrl = urlPattern.replace('99999', paperId); 
        
        console.log("--- START: FORM DATA FOR SUBMISSION ---");
        for (let pair of formData.entries()) {
            console.log(pair[0] + ': ' + pair[1]); 
        }
        console.log("--- END: FORM DATA FOR SUBMISSION ---");
        
        fetch(submitUrl, { // <-- Use the correctly constructed URL
            method: 'POST',
            body: formData,
            headers: { 'X-CSRFToken': csrfToken }, 
        })
        
            .then(response => {
                if (!response.ok) {
                    // Handle server validation/error (400 or 500)
                    return response.json().then(data => { 
                        throw data; // Throw the JSON data containing errors
                    });
                }
                return response.json();
            })
            .then(data => {
                // Successful submission
                document.getElementById('infoForm').classList.add('hidden');
                document.getElementById('submitSuccess').classList.remove('hidden');
                document.getElementById('formTitle').classList.add('hidden');
                console.log("Application Saved Successfully:", data);
            })
            .catch(error => {
                // --- UPDATED SERVER-SIDE ERROR HANDLING ---
                console.error('Error submitting application:', error);

                // 1. Handle form validation errors (400 response with 'errors' field)
                if (error.errors) {
                    
                    // Map Django name -> HTML ID
                    const fieldMap = {
                        'full_name': 'fullName', 
                        'phone_number': 'mobile', 
                        'total_experience': 'experience',
                        'resume_file': 'resume', 
                        'photo_file': 'photo',
                        'cover_letter': 'coverLetter',
                        'current_ctc': 'currentCTC',
                        'current_ctc_rate': 'currentCTCRate',
                        'expected_ctc': 'expectedCTC',
                        'expected_ctc_rate': 'expectedCTCRate',
                        'notice_period': 'noticePeriod',
                        'current_location': 'location',
                        'referral_source': 'referral',
                        // 'email' and 'skills' already match their HTML IDs
                    };
                    
                    let firstErrorElement = null;

                    // Iterate over Django errors
                    for (const djangoField in error.errors) {
                        const htmlId = fieldMap[djangoField] || djangoField;
                        const errorElement = document.getElementById(`error_${htmlId}`);
                        
                        if (errorElement) {
                            // Display the first error message for that field
                            const errorMessage = error.errors[djangoField][0];
                            errorElement.textContent = errorMessage;
                            errorElement.classList.remove('hidden');
                            
                            if (!firstErrorElement) {
                                firstErrorElement = errorElement;
                            }
                        }
                    }
                    
                    // Handle General/Non-Field errors
                    if (error.message && !firstErrorElement) {
                         alert(error.message); // For messages like Duplicate application (409)
                    }

                    // Scroll to the first error
                    if (firstErrorElement) {
                        firstErrorElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                    
                } else {
                    // 2. Handle generic errors (e.g., 404 Question Paper not found, general server error)
                    alert(error.message || "An unexpected server error occurred during submission.");
                }
            });
    } else {
        // If not valid (Frontend error), scroll to the first error
        const firstError = document.querySelector('.text-red-500:not(.hidden)');
        if (firstError) {
            firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }
    });
  </script>
</body>
</html>
