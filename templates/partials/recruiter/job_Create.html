
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Job Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar style */
        .form-container::-webkit-scrollbar { width: 8px; }
        .form-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .form-container::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* Style for invalid fields */
        .input-error {
            border-color: #ef4444 !important; /* Tailwind's red-500 */
        }
    </style>
</head>
<body class="bg-slate-50 text-gray-800">
    <div class="flex h-screen">
        {% include 'partials/sidebar.html' %}

        <div class="flex-1 flex flex-col overflow-hidden">
            {% include 'partials/header.html' with page_title="New Recruitment Drive" %}
            
            <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
                
                <div class="max-w-4xl mx-auto bg-white shadow-xl rounded-lg overflow-hidden">
                    <header class="bg-indigo-600 p-6">
                        <h1 class="text-2xl font-bold text-white">✍️ New Recruitment Drive</h1>
                        <p class="text-indigo-200 mt-1">Configure the main details for the job opening.</p>
                    </header>
            
                    <form id="job-post-form" class="p-6 md:p-8 form-container" method="post" onsubmit="return validateForm(event)">
                      {% csrf_token %}
                        <section class="mb-8 border-b pb-6">
                            <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                                <span class="mr-2 text-indigo-600">📌</span> Job Details
                            </h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label for="title" class="block text-sm font-medium text-gray-700">
                                        Job Title <span class="text-red-500">*</span>
                                    </label>
                                    <input type="text" id="title" name="title" required
                                           class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                                    <div id="error-title" class="text-sm text-red-500 mt-1 hidden"></div>
                                </div>
                                <div>
                                    <label for="department" class="block text-sm font-medium text-gray-700">Department</label>
                                    <input type="text" id="department" name="department"
                                           class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                                </div>
                                <div>
                                    <label for="location" class="block text-sm font-medium text-gray-700">Job Location</label>
                                    <input type="text" id="location" name="location"
                                           class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                                </div>
                                <div>
                                    <label for="job_type" class="block text-sm font-medium text-gray-700">
                                        Job Type <span class="text-red-500">*</span>
                                    </label>
                                    <select id="job_type" name="job_type" required
                                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                                        <option value="Full-Time">Full-Time</option>
                                        <option value="Part-Time">Part-Time</option>
                                        <option value="Contract">Contract</option>
                                        <option value="Internship">Internship</option>
                                    </select>
                                    <div id="error-job_type" class="text-sm text-red-500 mt-1 hidden"></div>
                                </div>
                            </div>
                            <div class="mt-6">
                                <label for="description" class="block text-sm font-medium text-gray-700">
                                    Job Description <span class="text-red-500">*</span>
                                </label>
                                <textarea id="description" name="description" rows="4" required
                                          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                                <div id="error-description" class="text-sm text-red-500 mt-1 hidden"></div>
                            </div>
                        </section>
            
                        <section class="mb-8 border-b pb-6">
                            <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                                <span class="mr-2 text-indigo-600">✨</span> Requirements
                            </h2>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div>
                                    <label for="experience_min" class="block text-sm font-medium text-gray-700">
                                        Experience Min (Years) <span class="text-red-500">*</span>
                                    </label>
                                    <input type="number" id="experience_min" name="experience_min" value="0" min="0" required
                                           class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                                    <div id="error-experience_min" class="text-sm text-red-500 mt-1 hidden"></div>
                                </div>
                                <div>
                                    <label for="experience_max" class="block text-sm font-medium text-gray-700">
                                        Experience Max (Years) <span class="text-red-500">*</span>
                                    </label>
                                    <input type="number" id="experience_max" name="experience_max" value="5" min="0" required
                                           class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                                    <div id="error-experience_max" class="text-sm text-red-500 mt-1 hidden"></div>
                                </div>
                                <div>
                                    <label for="positions_available" class="block text-sm font-medium text-gray-700">
                                        Positions Available <span class="text-red-500">*</span>
                                    </label>
                                    <input type="number" id="positions_available" name="positions_available" value="1" min="1" required
                                           class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                                    <div id="error-positions_available" class="text-sm text-red-500 mt-1 hidden"></div>
                                </div>
                            </div>
                            <div class="mt-6">
                                <label for="skills_required" class="block text-sm font-medium text-gray-700">Skills Required (Comma separated)</label>
                                <textarea id="skills_required" name="skills_required" rows="2"
                                          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500"
                                          placeholder="e.g., Python, Django, PostgreSQL, REST APIs"></textarea>
                            </div>
                        </section>
            
                        <section class="mb-8 pb-4">
                            <h2 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                                <span class="mr-2 text-indigo-600">⚙️</span> Recruitment Flow & Settings
                            </h2>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div>
                                    <label for="total_rounds" class="block text-sm font-medium text-gray-700">
                                        Total Interview Rounds <span class="text-red-500">*</span>
                                    </label>
                                    <input type="number" id="total_rounds" name="total_rounds" value="3" min="1" required
                                           class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                                    <div id="error-total_rounds" class="text-sm text-red-500 mt-1 hidden"></div>
                                </div>
                                <div>
                                    <label for="pay_scale" class="block text-sm font-medium text-gray-700">Pay Scale / Salary Range</label>
                                    <input type="text" id="pay_scale" name="pay_scale"
                                           class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500"
                                           placeholder="e.g., 8LPA - 12LPA or $80k - $120k">
                                </div>
                                <div>
                                    <label for="end_date" class="block text-sm font-medium text-gray-700">Application End Date</label>
                                    <input type="date" id="end_date" name="end_date"
                                           class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500">
                                </div>
                                <div>
                                    <label for="status" class="block text-sm font-medium text-gray-700">
                                        Status <span class="text-red-500">*</span>
                                    </label>
                                    <select id="status" name="status" required
                                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                                        <option value="Open">Open</option>
                                        <option value="Closed">Closed</option>
                                        <option value="Archived">Archived</option>
                                    </select>
                                    <div id="error-status" class="text-sm text-red-500 mt-1 hidden"></div>
                                </div>
                                <div class="md:col-span-2">
                                    <label for="question_paper" class="block text-sm font-medium text-gray-700">Written Test Question Paper</label>
                                    <select id="question_paper" name="question_paper"
                                            class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-indigo-500 focus:border-indigo-500 bg-white">
                                        <option value="" selected>--- Select an existing Question Paper (Optional) ---</option>
                                        <option value="1">Paper ID: 1 (Python Basic Test)</option>
                                        <option value="2">Paper ID: 2 (HR Aptitude Test)</option>
                                    </select>
                                </div>
                            </div>
                        </section>
                        
                        <hr class="my-8">
            
                        <div class="flex justify-end">
                            <button type="submit"
                                    class="px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                                💾 Save Job Post
                            </button>
                        </div>
                    </form>
                </div>
                </main>
        </div>
    </div>

    <script>
        // List of all required input fields' IDs
        const requiredFields = [
            'title', 'job_type', 'description', 
            'experience_min', 'experience_max', 'positions_available', 
            'total_rounds', 'status'
        ];

        function validateForm(event) {
            let isValid = true;
            
            // 1. Clear previous errors and styling
            requiredFields.forEach(fieldId => {
                const inputElement = document.getElementById(fieldId);
                const errorElement = document.getElementById(`error-${fieldId}`);
                
                inputElement.classList.remove('input-error');
                errorElement.classList.add('hidden');
                errorElement.innerHTML = '';
            });

            // 2. Check each required field
            requiredFields.forEach(fieldId => {
                const inputElement = document.getElementById(fieldId);
                const errorElement = document.getElementById(`error-${fieldId}`);
                
                // Check if the field is empty (or just whitespace for text/textarea)
                if (!inputElement.value || inputElement.value.trim() === '') {
                    isValid = false;
                    
                    // Add error styling and message
                    inputElement.classList.add('input-error');
                    errorElement.classList.remove('hidden');
                    
                    const labelText = inputElement.previousElementSibling.innerText.replace('*', '').trim();
                    errorElement.innerHTML = `**${labelText}** field is required.`;
                }
            });

            // 3. Prevent form submission if not valid
            if (!isValid) {
                event.preventDefault(); // Stop the form from submitting
                // Scroll to the top error if necessary
                const firstInvalidField = document.querySelector('.input-error');
                if (firstInvalidField) {
                    firstInvalidField.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            return isValid;
        }
    </script>
</body>
</html>
